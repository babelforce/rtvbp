[workspace]
members = [
    "crates/rtvbp-spec-babelforce-v1",
    "crates/rtvbp-spec-model",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2.0"
