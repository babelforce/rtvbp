name: Release Protocol

on:
  push:
    tags:
      - 'protocol/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protocol/v* tag to republish with current release automation
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            protocol/v*) ;;
            *) echo "invalid protocol release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: website/yarn.lock
      - uses: arduino/setup-task@v2
      - name: Install demo audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev
      - run: yarn install --frozen-lockfile
        working-directory: website
      - run: task check
      - name: Check out immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: release-source
      - name: Build and verify release assets
        id: release_material
        run: |
          version="${RELEASE_TAG#protocol/v}"
          python3 tools/release/release_tool.py \
            --component protocol \
            --tag "$RELEASE_TAG" \
            --source-root release-source \
            --metadata-root . \
            --output release-output
          checksum="release-output/assets/rtvbp-protocol-v${version}-SHA256SUMS"
          (cd release-output/assets && sha256sum -c "$(basename "$checksum")")
          tar -tzf "release-output/assets/rtvbp-protocol-v${version}.tar.gz"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.release_material.outputs.checksum }}
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-output/release-notes.md
          files: release-output/assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: true
