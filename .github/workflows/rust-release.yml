name: Release Rust SDK

on:
  push:
    tags:
      - 'sdk/rust/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing sdk/rust/v* tag to republish with current release automation
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            sdk/rust/v*) ;;
            *) echo "invalid Rust release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: website/yarn.lock
      - uses: arduino/setup-task@v2
      - name: Install demo audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev
      - run: yarn install --frozen-lockfile
        working-directory: website
      - run: task check
      - name: Check out immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: release-source
      - name: Package the immutable release source
        run: cargo package --locked --manifest-path release-source/sdk/rust/Cargo.toml
      - name: Resolve the tag from a clean external project
        run: |
          project="$(mktemp -d)"
          cargo new --quiet "$project/consumer"
          cd "$project/consumer"
          cargo add rtvbp --git "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --tag "$RELEASE_TAG"
          cargo check --locked
      - name: Build release notes and assets
        id: release_material
        run: |
          version="${RELEASE_TAG#sdk/rust/v}"
          python3 tools/release/release_tool.py \
            --component rust \
            --tag "$RELEASE_TAG" \
            --source-root release-source \
            --metadata-root . \
            --output release-output \
            --packaged-artifact "release-source/sdk/rust/target/package/rtvbp-${version}.crate"
          checksum="release-output/assets/rtvbp-rust-v${version}-SHA256SUMS"
          (cd release-output/assets && sha256sum -c "$(basename "$checksum")")
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.release_material.outputs.checksum }}
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-output/release-notes.md
          files: release-output/assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: false
