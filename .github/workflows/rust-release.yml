name: Release Rust SDK

on:
  push:
    tags:
      - 'sdk/rust/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing sdk/rust/v* tag to publish after a transient tag-workflow failure
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            sdk/rust/v*) ;;
            *) echo "invalid Rust release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: website/yarn.lock
      - uses: arduino/setup-task@v2
      - name: Install demo audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev
      - run: yarn install --frozen-lockfile
        working-directory: website
      - run: task check
      - run: cargo package --locked --manifest-path sdk/rust/Cargo.toml
      - name: Resolve the tag from a clean external project
        run: |
          project="$(mktemp -d)"
          cargo new --quiet "$project/consumer"
          cd "$project/consumer"
          cargo add rtvbp --git "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --tag "$RELEASE_TAG"
          cargo check --locked
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
