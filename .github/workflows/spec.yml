name: Spec

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path spec/Cargo.toml
      - run: cargo run --locked --manifest-path spec/Cargo.toml -p rtvbp-spec-gen -- --check
