name: Protocol gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: website/yarn.lock
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install demo audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes portaudio19-dev
      - name: Install the pinned ess release
        env:
          ESS_VERSION: 0.97.1
          ESS_SHA256: fdfffe4d82f288378fee35df5ffb46adc9cb2ae22486e9dbf612eec26cc00c84
        run: |
          archive="ess-${ESS_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/beyond10x/ess/releases/download/${ESS_VERSION}/${archive}"
          echo "${ESS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/ess-${ESS_VERSION}-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"
      - run: ess --version
      - run: yarn install --frozen-lockfile
        working-directory: website
      - run: task check
