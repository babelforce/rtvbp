name: Spec

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - run: cargo test --locked --manifest-path spec/Cargo.toml
      - run: cargo run --locked --manifest-path spec/Cargo.toml -p rtvbp-spec-gen -- --check
      - run: test -z "$(gofmt -l sdk/go/catalog)"
      - run: GOWORK=off go test ./...
        working-directory: sdk/go
