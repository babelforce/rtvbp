<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RTVBP — Real-Time Voice Bridge Protocol</title>
  <desc id="desc">A voice peer and application peer connected by typed control and duplex audio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#181e32"/>
      <stop offset="1" stop-color="#05445e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop stop-color="#5bcace" stop-opacity=".32"/>
      <stop offset="1" stop-color="#5bcace" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow)"/>
  <g transform="translate(72 62)" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="square">
    <path d="M0 0v36h34"/>
    <path d="M34 36v36H0"/>
  </g>
  <text x="140" y="106" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4">RTVBP</text>
  <text x="72" y="236" fill="#5bcace" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="4">REAL-TIME VOICE BRIDGE PROTOCOL</text>
  <text x="72" y="326" fill="#fff" font-family="Georgia, serif" font-size="68" font-weight="600">One voice protocol.</text>
  <text x="72" y="404" fill="#fff" font-family="Georgia, serif" font-size="68" font-weight="600">Any application.</text>
  <g transform="translate(74 484)">
    <rect width="300" height="82" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
    <text x="24" y="34" fill="#5bcace" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">VOICE PEER</text>
    <text x="24" y="60" fill="#fff" font-family="Arial, sans-serif" font-size="18">telephony</text>
    <path d="M320 30h192" stroke="#5bcace" stroke-width="2"/>
    <path d="M512 52H320" stroke="#5bcace" stroke-width="2"/>
    <circle cx="320" cy="30" r="5" fill="#5bcace"/>
    <circle cx="512" cy="52" r="5" fill="#5bcace"/>
    <rect x="532" width="360" height="82" rx="16" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
    <text x="556" y="34" fill="#5bcace" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">APPLICATION PEER</text>
    <text x="556" y="60" fill="#fff" font-family="Arial, sans-serif" font-size="18">agent · IVR · service</text>
  </g>
  <text x="1128" y="586" fill="#fff" fill-opacity=".58" font-family="Arial, sans-serif" font-size="18" text-anchor="end">stewarded by babelforce</text>
</svg>
