version: '3'

tasks:
  generate:
    desc: Regenerate every artifact owned by the protocol specification
    cmds:
      - cargo run --locked --manifest-path spec/Cargo.toml -p rtvbp-spec-gen -- --emit=manifest
      - cargo run --locked --manifest-path spec/Cargo.toml -p rtvbp-spec-gen -- --emit=go
      - cargo run --locked --manifest-path spec/Cargo.toml -p rtvbp-spec-gen -- --emit=rust
      - cargo run --locked --manifest-path spec/Cargo.toml -p rtvbp-spec-gen -- --emit=typescript
      - cargo run --locked --manifest-path spec/Cargo.toml -p rtvbp-spec-gen -- --emit=docs
      - cargo run --locked --manifest-path spec/Cargo.toml -p rtvbp-spec-gen -- --emit=vectors

  check:
    desc: Run the complete local release gate in CI order
    cmds:
      - PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/release -p 'test_*.py'
      - cargo test --locked --manifest-path spec/Cargo.toml
      - task: generate
      - git diff --exit-code
      - cargo fmt --manifest-path sdk/rust/Cargo.toml --all --check
      - cargo clippy --locked --manifest-path sdk/rust/Cargo.toml --all-targets -- -D warnings
      - cargo test --locked --manifest-path sdk/rust/Cargo.toml --all-targets
      - (cd sdk/go && go test ./...)
      - (cd sdk/typescript && npm ci && npm test && npm run typecheck && npm run build && npm run verify:package)
      - (cd sdk/go/examples/babelforce-auth && go test ./...)
      - (cd sdk/go/examples/rtvbp-demo-client && go test ./...)
      - (cd sdk/go/examples/rtvbp-demo-server && go test ./...)
      - (cd website && yarn typecheck)
      - (cd website && yarn build)
