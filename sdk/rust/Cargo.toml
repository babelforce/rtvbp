[package]
name = "rtvbp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust SDK for the Real-Time Voice Bridge Protocol"
repository = "https://github.com/babelforce/rtvbp"
rust-version = "1.88"
exclude = ["tests/**"]

[dependencies]
async-trait = "0.1.89"
futures-util = { version = "0.3.31", features = ["sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2.0.19"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
webrtc = "=0.14.0"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
